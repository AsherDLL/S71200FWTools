[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s71200"
version = "1.1.0"
description = "Siemens SIMATIC S7-1200 firmware container parser, image extractor and IDA Pro loader"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["siemens", "s7-1200", "plc", "firmware", "reverse-engineering", "lzp", "ida-pro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]
dependencies = []

# The package has no runtime requirements, which is what lets the IDA loader
# import it from whichever interpreter IDAPython happens to be built against.
[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
s71200 = "s71200.cli:main"

[tool.setuptools]
packages = ["s71200"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

# Pin the rule set. Ruff's implicit default widens between releases, so leaving
# it unset means an unrelated ruff upgrade can fail a project that has not
# changed. These are pyflakes, the pycodestyle errors worth enforcing, and
# import sorting.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
